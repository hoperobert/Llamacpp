<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket LLM</title>
<meta name="description" content="A chat model that runs entirely on this device, offline.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151613" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pocket LLM">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Pocket LLM</h1>
  <div id="badges" aria-live="polite"></div>
</header>

<main>
  <section id="setup">
    <p class="lead">Runs on this device. Nothing you type leaves it.</p>

    <fieldset id="models">
      <legend>Model</legend>
    </fieldset>

    <button id="load" class="primary" type="button">Download and start</button>

    <div id="progress" hidden>
      <div class="bar"><div id="bar"></div></div>
      <p id="progressText"></p>
    </div>

    <p id="error" class="error" role="alert" hidden></p>

    <p id="installHint" class="hint" hidden>
      To keep it working offline, tap <strong>Share</strong> then
      <strong>Add to Home Screen</strong>, and open it from there.
    </p>

    <p id="storage" class="hint"></p>
    <button id="clear" class="link" type="button" hidden>Delete downloaded models</button>
  </section>

  <section id="chat" hidden>
    <div id="messages" aria-live="polite"></div>
  </section>
</main>

<footer id="composer" hidden>
  <p id="stats"></p>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Message" autocomplete="off" enterkeyhint="send"></textarea>
    <button id="send" class="primary" type="submit">Send</button>
  </form>
  <div class="row">
    <button id="reset" class="link" type="button">New chat</button>
    <button id="change" class="link" type="button">Change model</button>
  </div>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
