# Builds the iPhone app and sends it to TestFlight, on GitHub's own Mac.
#
# Expo's build service does the same and allows a set number of builds a month
# on its free plan. This has no such limit: a public repository's use of
# GitHub's machines is free. The build is the same one (same profile in
# native/eas.json, same signing, kept by Expo), made here instead of there.
#
# It needs one secret, EXPO_TOKEN: an access token from expo.dev, saved under
# Settings > Secrets and variables > Actions in this repository.
#
# It runs when native/testflight/build is changed, or by hand. Never on its
# own, so builds can be grouped.

name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths:
      - 'native/testflight/build'

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    # Free on a public repository. The limit keeps a stuck run from going on.
    timeout-minutes: 100
    defaults:
      run:
        working-directory: native
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_NO_TELEMETRY: '1'
      CI: '1'
    steps:
      - name: Check the Expo token is there
        working-directory: .
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::There is no EXPO_TOKEN secret. Create an access token at expo.dev and save it in this repository under Settings > Secrets and variables > Actions, named EXPO_TOKEN."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Use the newest Xcode
        run: |
          newest="$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "$newest"
          xcodebuild -version

      - name: Install packages
        run: npm ci

      - name: Run the checks
        run: npm test

      - name: Tools the build needs
        run: |
          which fastlane || brew install fastlane
          fastlane --version | tail -1
          pod --version

      # The same build Expo's service would make, made on this machine. The
      # signing certificate and profile are fetched from Expo with the token.
      - name: Build
        run: |
          # Expo's scan for its modules is given five seconds, which a busy machine can miss.
          # A second try is all it needs.
          for attempt in 1 2; do
            if npx --yes eas-cli@27.10.0 build --local --platform ios --profile production --non-interactive --output "$RUNNER_TEMP/PocketLLM.ipa"; then
              break
            fi
            echo "Attempt $attempt did not finish."
          done
          test -f "$RUNNER_TEMP/PocketLLM.ipa"

      - name: Send to TestFlight
        run: npx --yes eas-cli@27.10.0 submit --platform ios --profile production --path "$RUNNER_TEMP/PocketLLM.ipa" --non-interactive --no-wait
