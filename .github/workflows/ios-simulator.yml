# Runs the app in an iOS simulator and keeps screenshots of it.
#
# The app's keyboard and layout behaviour can only be seen on iOS. This builds
# a test version that works itself through the cases that have gone wrong on a
# real iPhone (native/src/lib/sim.run.ts), takes a screenshot every second, and
# puts them on the `sim-screenshots` branch. See native/sim/README.md.
#
# It runs when native/sim/run is changed, or by hand.

name: iOS simulator

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths:
      - 'native/sim/run'
      - '.github/workflows/ios-simulator.yml'

permissions:
  contents: write

concurrency:
  group: ios-simulator
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-26
    # Free on a public repository. The limit keeps a stuck run from going on.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: native
    env:
      EXPO_NO_TELEMETRY: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4

      # native/sim/run says which kind of test build to make: "real" uses the real
      # engine and a real small model, "1" the stand-ins from the browser preview.
      - name: Choose what to test
        run: |
          mode="$(head -1 sim/run | tr -d '[:space:]')"
          case "$mode" in real|1) ;; *) mode=real ;; esac
          echo "POCKET_SIM=$mode" >> "$GITHUB_ENV"
          echo "Testing with POCKET_SIM=$mode"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Use the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          newest="$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)"
          sudo xcode-select -s "$newest"
          xcodebuild -version

      - name: Install packages
        run: npm ci

      - name: Make the iOS project
        run: npx expo prebuild --platform ios --no-install

      - uses: actions/cache@v4
        with:
          path: |
            native/ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('native/package-lock.json', 'native/app.json') }}

      - name: Install pods
        run: cd ios && pod install

      - name: Build for the simulator
        run: |
          echo "Building with POCKET_SIM=$POCKET_SIM"
          workspace="$(ls -d ios/*.xcworkspace | head -1)"
          scheme="$(basename "$workspace" .xcworkspace)"
          echo "workspace $workspace, scheme $scheme"
          set -o pipefail
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "^(\*\*|error|warning: unable|ld:|Undefined|❌)|error:|BUILD" || true
          tail -5 build.log
          ls -d build/Build/Products/Release-iphonesimulator/*.app

      - name: Start a simulator
        run: |
          # The software keyboard only shows when no hardware keyboard is attached.
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl list runtimes
          device="$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          found = []
          for runtime, devices in json.load(sys.stdin)['devices'].items():
              if 'iOS' not in runtime: continue
              version = tuple(int(n) for n in runtime.split('iOS-')[-1].split('-'))
              for d in devices:
                  if d['name'].startswith('iPhone'):
                      found.append((version, 'Pro' in d['name'] and 'Max' not in d['name'], d['name'], d['udid']))
          found.sort()
          print(found[-1][3]); print(found[-1][2], found[-1][0], file=sys.stderr)
          ")"
          echo "DEVICE=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl ui "$device" appearance dark

      # A spare copy of the small model, in case the app's own download of it fails.
      - uses: actions/cache@v4
        if: env.POCKET_SIM == 'real'
        with:
          path: native/model
          key: model-qwen35-0.8b-q4_0

      - name: Fetch the spare model
        if: env.POCKET_SIM == 'real'
        run: |
          mkdir -p model
          [ -s model/Qwen3.5-0.8B-Q4_0.gguf ] || curl -sSL --retry 3 -o model/Qwen3.5-0.8B-Q4_0.gguf \
            https://huggingface.co/ggml-org/Qwen3.5-0.8B-GGUF/resolve/main/Qwen3.5-0.8B-Q4_0.gguf
          ls -la model

      - name: Run the app and take screenshots
        run: |
          app="$(ls -d build/Build/Products/Release-iphonesimulator/*.app | head -1)"
          bundle="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          process="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          mkdir -p shots
          xcrun simctl install "$DEVICE" "$app"
          data="$(xcrun simctl get_app_container "$DEVICE" "$bundle" data)"
          if [ "$POCKET_SIM" = real ]; then
            mkdir -p "$data/Documents"
            cp model/Qwen3.5-0.8B-Q4_0.gguf "$data/Documents/spare-Qwen3.5-0.8B-Q4_0.gguf"
          fi
          xcrun simctl spawn "$DEVICE" log stream --level info --predicate "process == \"$process\"" > shots/log-full.txt 2>&1 &
          xcrun simctl launch "$DEVICE" "$bundle"
          left=0
          dumped=0
          # Lets the debugger look inside the app when it asks to be described.
          sudo DevToolsSecurity -enable > /dev/null 2>&1 || true
          # One screenshot a second, named by the clock, until the app says it has finished.
          for i in $(seq 1 700); do
            now="$(python3 -c 'import time; print(int(time.time() * 1000))')"
            xcrun simctl io "$DEVICE" screenshot --type=jpeg "shots/$now.jpg" > /dev/null 2>&1 || true
            if [ -f "$data/Documents/sim-steps.txt" ]; then
              cp "$data/Documents/sim-steps.txt" shots/steps.txt
              if grep -q " finished " shots/steps.txt; then break; fi
              # The app asks for the system's own list of what is on screen: every view,
              # where it is and how see-through. It is the way to tell what a layer over the chat is.
              wanted="$(grep -c " DUMP " shots/steps.txt || true)"
              if [ "$wanted" -gt "$dumped" ]; then
                dumped="$wanted"
                pid="$(pgrep -x "$process" | head -1)"
                echo "$now describing the screen ($wanted), process $pid" >> shots/outside.txt
                ( lldb --batch -p "$pid" \
                    -o 'expr -l objc -- (BOOL)[[[[[UIApplication sharedApplication] windows] firstObject] recursiveDescription] writeToFile:[NSHomeDirectory() stringByAppendingPathComponent:@"Documents/hierarchy.txt"] atomically:YES encoding:4 error:nil]' \
                    -o 'detach' > "shots/lldb-$wanted.txt" 2>&1 ) &
                debugger=$!
                for wait in $(seq 1 40); do kill -0 "$debugger" 2>/dev/null || break; sleep 1; done
                kill -9 "$debugger" 2>/dev/null || true
                cp "$data/Documents/hierarchy.txt" "shots/hierarchy-$wanted.txt" 2>/dev/null || true
                rm -f "$data/Documents/hierarchy.txt"
              fi
              # The app asks to be sent to the background and brought back.
              asked="$(grep -c " LEAVE " shots/steps.txt || true)"
              if [ "$asked" -gt "$left" ]; then
                left="$asked"
                echo "$now leaving the app ($asked)" >> shots/outside.txt
                xcrun simctl launch "$DEVICE" com.apple.Preferences > /dev/null 2>&1 || true
                sleep 6
                xcrun simctl io "$DEVICE" screenshot --type=jpeg "shots/$now-away.jpg" > /dev/null 2>&1 || true
                xcrun simctl launch "$DEVICE" "$bundle" >> shots/outside.txt 2>&1 || true
              fi
            fi
            sleep 0.6
          done
          cat shots/steps.txt || true
          # Half size is plenty to read, and keeps the branch small.
          sips -Z 1320 shots/*.jpg > /dev/null
          ls shots | wc -l
          # Anything the system recorded about the app closing by itself.
          cp ~/Library/Logs/DiagnosticReports/*"$process"* shots/ 2>/dev/null || true
          grep -E "\[sim\]|rror|rash|xception|Terminat|llama|Uncaught" shots/log-full.txt | tail -400 > shots/log.txt || true
          rm -f shots/log-full.txt

      - name: Keep the screenshots
        if: always()
        run: |
          mkdir -p shots
          cp build.log shots/build-tail.txt 2>/dev/null && tail -200 shots/build-tail.txt > shots/build.txt && rm shots/build-tail.txt || true
          cd shots
          echo "Screenshots from run ${{ github.run_id }} of commit ${{ github.sha }}." > README.md
          git init -q -b sim-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots from run ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" sim-screenshots
